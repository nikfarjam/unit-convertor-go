name: Release Unit Converter API

env:
    GO_VERSION: "1.26.4"

on:
    push:
        branches:
            - main
            - develop
    workflow_run:
        workflows: ["Lint, Test and Build Unit Converter API"]
        types:
            - completed

jobs:
    set-ci-variables:
        runs-on: ubuntu-latest
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
        outputs:
            API_VERSION: ${{ steps.set-env.outputs.API_VERSION }}
            IMAGE_TAG: ${{ steps.set-env.outputs.IMAGE_TAG }}
            GHCR_TAG: ${{ steps.set-env.outputs.GHCR_TAG }}
            DOCKER_HUB_LATEST: ${{ steps.set-env.outputs.DOCKER_HUB_LATEST }}
            GHCR_LATEST: ${{ steps.set-env.outputs.GHCR_LATEST }}
            IS_RELEASE: ${{ steps.set-env.outputs.IS_RELEASE }}
        steps:
            - uses: actions/checkout@v6
            - name: Set Pipeline environment variables
              id: set-env
              shell: bash
              run: |
                  api_version="$(cat version)"
                  branch="${GITHUB_REF#refs/heads/}"
                  if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
                    branch="${{ github.event.workflow_run.head_branch }}"
                  fi

                  docker_hub_image="${{ vars.DOCKER_HUB_REPOSITORY }}/unit-converter-api-lightweight"
                  ghcr_owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
                  ghcr_image="ghcr.io/${ghcr_owner}/unit-converter-api-lightweight"

                  is_release="false"
                  if [[ "${branch}" == "main" ]]; then
                    image_tag="${docker_hub_image}:${api_version}"
                    ghcr_tag="${ghcr_image}:${api_version}"
                    is_release="true"
                  elif [[ "${branch}" == "develop" ]]; then
                    image_tag="${docker_hub_image}:${api_version}-beta"
                    ghcr_tag="${ghcr_image}:${api_version}-beta"
                  else
                    image_tag="${docker_hub_image}:test"
                    ghcr_tag="${ghcr_image}:test"
                  fi

                  docker_hub_latest="${docker_hub_image}:latest"
                  ghcr_latest="${ghcr_image}:latest"

                  echo "API_VERSION=${api_version}" >> $GITHUB_OUTPUT
                  echo "IMAGE_TAG=${image_tag}" >> $GITHUB_OUTPUT
                  echo "GHCR_TAG=${ghcr_tag}" >> $GITHUB_OUTPUT
                  echo "DOCKER_HUB_LATEST=${docker_hub_latest}" >> $GITHUB_OUTPUT
                  echo "GHCR_LATEST=${ghcr_latest}" >> $GITHUB_OUTPUT
                  echo "IS_RELEASE=${is_release}" >> $GITHUB_OUTPUT

    docker-build-image:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      archSuffix: amd64
                    - os: ubuntu-24.04-arm
                      archSuffix: arm64
        runs-on: ${{ matrix.os }}
        needs: ["set-ci-variables"]
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push Docker image
              id: build
              shell: bash
              run: |
                  dh_tag="${{ needs.set-ci-variables.outputs.IMAGE_TAG }}-${{ matrix.archSuffix }}"
                  ghcr_tag="${{ needs.set-ci-variables.outputs.GHCR_TAG }}-${{ matrix.archSuffix }}"

                  make build-image IMAGE_TAG="${dh_tag}"
                  docker push "${dh_tag}"

                  docker tag "${dh_tag}" "${ghcr_tag}"
                  docker push "${ghcr_tag}"

    create-manifest:
        runs-on: ubuntu-latest
        needs: ["docker-build-image", "set-ci-variables"]
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Create and push multi-arch manifest
              shell: bash
              run: |
                  dh_tag="${{ needs.set-ci-variables.outputs.IMAGE_TAG }}"
                  ghcr_tag="${{ needs.set-ci-variables.outputs.GHCR_TAG }}"
                  is_release="${{ needs.set-ci-variables.outputs.IS_RELEASE }}"

                  if [[ -z "${dh_tag}" || -z "${ghcr_tag}" ]]; then
                    echo "ERROR: IMAGE_TAG or GHCR_TAG output is empty." >&2
                    exit 1
                  fi

                  docker manifest create "${dh_tag}" \
                    "${dh_tag}-amd64" \
                    "${dh_tag}-arm64"
                  docker manifest push "${dh_tag}"

                  docker manifest create "${ghcr_tag}" \
                    "${ghcr_tag}-amd64" \
                    "${ghcr_tag}-arm64"
                  docker manifest push "${ghcr_tag}"

                  if [[ "${is_release}" == "true" ]]; then
                    dh_latest="${{ needs.set-ci-variables.outputs.DOCKER_HUB_LATEST }}"
                    ghcr_latest="${{ needs.set-ci-variables.outputs.GHCR_LATEST }}"

                    docker manifest create "${dh_latest}" \
                      "${dh_tag}-amd64" \
                      "${dh_tag}-arm64"
                    docker manifest push "${dh_latest}"

                    docker manifest create "${ghcr_latest}" \
                      "${ghcr_tag}-amd64" \
                      "${ghcr_tag}-arm64"
                    docker manifest push "${ghcr_latest}"
                  fi

    tag-branch:
        runs-on: ubuntu-latest
        needs: ["set-ci-variables"]
        if: needs.set-ci-variables.outputs.IS_RELEASE == 'true'
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - name: Tag branch
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  api_version="${{ needs.set-ci-variables.outputs.API_VERSION }}"
                  git fetch --tags
                  if git rev-parse "origin/${api_version}" >/dev/null 2>&1 || git ls-remote --tags origin | grep "refs/tags/${api_version}" >/dev/null; then
                    echo "Tag ${api_version} already exists on remote. Skipping tag creation and push."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "${api_version}"
                  git push origin "${api_version}"
            - name: Create GitHub Release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ needs.set-ci-variables.outputs.API_VERSION }}
                  release_name: "Release ${{ needs.set-ci-variables.outputs.API_VERSION }}"
                  body: "Release ${{ needs.set-ci-variables.outputs.API_VERSION }} created by workflow."
                  draft: false
                  prerelease: false
