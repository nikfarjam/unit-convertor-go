name: 🚀 Release Unit Converter API

env:
    GO_VERSION: "1.27.4"

on:
    pull_request:
        types:
            - closed
        branches:
            - main
            - develop

jobs:
    set-ci-variables:
        runs-on: ubuntu-latest
        if: github.event.pull_request.merged == true
        outputs:
            API_VERSION: ${{ steps.set-env.outputs.API_VERSION }}
            IMAGE_TAG: ${{ steps.set-env.outputs.IMAGE_TAG }}
            GHCR_IMAGE_TAG: ${{ steps.set-env.outputs.GHCR_IMAGE_TAG }}
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v7
            - name: ⚙️ Set pipeline environment variables
              id: set-env
              shell: bash
              run: |
                  image_name="${{ vars.DOCKER_HUB_REPOSITORY }}/unit-converter-api-lightweight"
                  api_version="$(cat version)"
                  if [[ "${GITHUB_BASE_REF}" == develop ]]; then
                    version_tag="${api_version}-beta"
                  elif [[ "${GITHUB_BASE_REF}" == main ]]; then
                    version_tag="${api_version}"
                  else
                    version_tag="test"
                  fi
                  image_tag="${image_name}:${version_tag}"
                  ghcr_image_tag="ghcr.io/${GITHUB_REPOSITORY}:${version_tag}"
                  echo "API_VERSION=${api_version}" >> $GITHUB_OUTPUT
                  echo "IMAGE_TAG=${image_tag}" >> $GITHUB_OUTPUT
                  echo "GHCR_IMAGE_TAG=${ghcr_image_tag}" >> $GITHUB_OUTPUT

    docker-build-image:
        runs-on: ubuntu-latest
        needs: ["set-ci-variables"]
        permissions:
            contents: read
            packages: write
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v7
            - name: 🔐 Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: 🔐 Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: 🧰 Set up QEMU
              uses: docker/setup-qemu-action@v4
            - name: ⚙️ Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: 🐳 Build and push multi-arch Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      ${{ needs.set-ci-variables.outputs.IMAGE_TAG }}
                      ${{ needs.set-ci-variables.outputs.GHCR_IMAGE_TAG }}
                  sbom: true
                  provenance: true

    tag-branch:
        runs-on: ubuntu-latest
        needs: ["set-ci-variables"]
        if: github.base_ref == 'main'
        permissions:
            contents: write
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v7
            - name: 🏷️ Tag branch
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  api_version="${{ needs.set-ci-variables.outputs.API_VERSION }}"
                  git fetch --tags
                  if git rev-parse "origin/${api_version}" >/dev/null 2>&1 || git ls-remote --tags origin | grep "refs/tags/${api_version}" >/dev/null; then
                    echo "Tag ${api_version} already exists on remote. Skipping tag creation and push."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "${api_version}"
                  git push origin "${api_version}"
            - name: 🎉 Create GitHub Release
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ needs.set-ci-variables.outputs.API_VERSION }}
                  name: "Release ${{ needs.set-ci-variables.outputs.API_VERSION }}"
                  body: "Release ${{ needs.set-ci-variables.outputs.API_VERSION }} created by workflow."
                  draft: false
                  prerelease: false
